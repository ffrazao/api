name: CI/CD - @ffrazao/fotografo-de-faces

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ffrazao'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Automated Tests
        run: npm run test

      - name: Build Library and Types
        run: npm run build

      - name: Build Static Storybook
        run: npm run build-storybook

      - name: Check and Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extrai a versão atual do package.json
          VERSION=$(node -p "require('./package.json').version")

          echo "Verificando se a versão $VERSION já está publicada..."

          # Tenta consultar a versão específica no registro privado do GitHub Packages.
          # Se o comando npm view falhar (indica que a versão não existe), procede com a publicação.
          if npm view @ffrazao/fotografo-de-faces@$VERSION version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "A versão $VERSION já está publicada no GitHub Packages. Publicação ignorada para evitar falha no build."
          else
            echo "A versão $VERSION não foi encontrada. Iniciando publicação..."
            npm publish --registry=https://npm.pkg.github.com
          fi
