name: CI/CD - @ffrazao/fotografo-de-faces

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # O pacote vive em fotografo-de-faces/, não na raiz do monorepo — que não tem
    # package.json. Sem isto, todo `run:` abaixo falha já no `npm ci`.
    defaults:
      run:
        working-directory: fotografo-de-faces

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 quebra a suíte inteira: jsdom@30 embute undici@8, que chama
          # `worker_threads.markAsUncloneable` — API inexistente até o Node 20.20.2
          # (a última da linha, já em EOL). O sintoma é
          # `TypeError: webidl.util.markAsUncloneable is not a function` em todos
          # os arquivos de teste. Node 24 (LTS ativo "Krypton") satisfaz tanto
          # `jsdom engines: ^22.22.2 || ^24.15.0 || >=26.0.0` quanto
          # `undici engines: >=22.19.0`.
          node-version: 24
          cache: 'npm'
          # `defaults.run` não alcança entradas de action: sem este caminho
          # explícito, o cache seria calculado sobre o package-lock.json vazio
          # da raiz do monorepo.
          cache-dependency-path: fotografo-de-faces/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ffrazao'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Automated Tests
        run: npm run test

      - name: Build Library and Types
        run: npm run build

      - name: Build Static Storybook
        run: npm run build-storybook

      - name: Check and Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extrai a versão atual do package.json
          VERSION=$(node -p "require('./package.json').version")

          echo "Verificando se a versão $VERSION já está publicada..."

          # Tenta consultar a versão específica no registro privado do GitHub Packages.
          # Se o comando npm view falhar (indica que a versão não existe), procede com a publicação.
          if npm view @ffrazao/fotografo-de-faces@$VERSION version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "A versão $VERSION já está publicada no GitHub Packages. Publicação ignorada para evitar falha no build."
          else
            echo "A versão $VERSION não foi encontrada. Iniciando publicação..."

            # O rótulo de publicação é derivado da própria versão, sem intervenção
            # manual a cada release.
            #
            # O npm recusa publicar uma versão de pré-lançamento sem rótulo
            # explícito ("You must specify a tag using --tag when publishing a
            # prerelease version"). É uma proteção: sem isso, uma rc assumiria
            # "latest" e chegaria a quem instalasse o pacote sem pedir versão.
            #
            # Uma versão SemVer completa tem a forma
            # `1.0.0-rc.1+build.5`, com duas partes opcionais: o pré-lançamento
            # (depois do primeiro hífen) e o metadado de build (depois do `+`).
            # O rótulo é o primeiro identificador do pré-lançamento, extraído em
            # três passos:

            # 1. Descartar o metadado de build. Isto vem primeiro porque o
            #    metadado pode conter hífens (`1.0.0+build-5`), o que faria uma
            #    versão estável parecer pré-lançamento no passo seguinte.
            VERSION_CORE="${VERSION%%+*}"

            case "$VERSION_CORE" in
              *-*)
                # 2. Tudo depois do primeiro hífen é o pré-lançamento: "rc.1".
                PRERELEASE="${VERSION_CORE#*-}"
                # 3. O rótulo é o identificador antes do primeiro ponto, ou seja,
                #    o nome sem o número de sequência: "rc.1" -> "rc".
                NPM_TAG="--tag ${PRERELEASE%%.*}"
                ;;
              *)
                NPM_TAG=""
                ;;
            esac

            # Resultado, para as formas que este pacote usa:
            #
            #   1.0.0-rc.1          ->  --tag rc
            #   2.1.3-beta.0        ->  --tag beta
            #   1.0.0-alpha         ->  --tag alpha
            #   1.0.0-rc.1+build.5  ->  --tag rc
            #   1.0.0               ->  (nenhum)
            #
            # Um pré-lançamento só é instalado sob demanda, pedindo o rótulo
            # (`npm install @ffrazao/fotografo-de-faces@rc`), e "latest"
            # permanece intocado. Uma versão estável publica sem `--tag`, e o npm
            # move "latest" para ela automaticamente.

            # $NPM_TAG é deliberadamente deixado sem aspas: ou se expande em dois
            # argumentos (--tag rc), ou desaparece por completo quando vazio. Com
            # aspas, o caso estável passaria uma string vazia como argumento ao npm.
            npm publish $NPM_TAG --registry=https://npm.pkg.github.com
          fi
